<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Checker (LanguageTool Docker)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        textarea {
            width: 80%;
            height: 100px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Grammar Checker (Offline LanguageTool Docker)</h2>
    
    <textarea id="inputText" placeholder="Enter text here..."></textarea>
    <br>
    <button onclick="checkGrammar()">Check Grammar</button>
    <br><br>
    <textarea id="outputText" placeholder="Corrected text will appear here..." readonly></textarea>

    <script>
        async function checkGrammar() {
            let inputText = document.getElementById("inputText").value;

            if (!inputText.trim()) {
                alert("Please enter some text.");
                return;
            }

            try {
                // Call the LanguageTool Docker API directly
                const response = await fetch("http://127.0.0.1:8010/v2/check", { // Update with your Docker container port
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: `language=en-US&text=${encodeURIComponent(inputText)}`
                });

                const data = await response.json();
                let correctedText = inputText.split(""); // Convert string to array for safe modifications

                let matches = data.matches;
                for (let i = matches.length - 1; i >= 0; i--) {
                    let match = matches[i];

                    // ✅ Ensure replacements exist and are strings
                    let replacement = match.replacements.length > 0 ? match.replacements[0] : null;

                    if (replacement) {
                        correctedText.splice(match.offset, match.length, replacement);
                    }
                }

                document.getElementById("outputText").value = correctedText.join(""); // Convert array back to string
            } catch (error) {
                console.error("Error connecting to LanguageTool:", error);
                alert("Error: Unable to connect to LanguageTool. Make sure the server is running.");
            }
        }
    </script>

</body>
</html>
